<!doctype html>
<html lang="en">
  <head>
    <title>Page not found (404)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f4ee; color: #1b2924;
             font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
             -webkit-font-smoothing: antialiased; line-height: 1.5; }
      main { width: 100%; max-width: 480px; background: #fff; border: 1px solid #dfe3dc; border-radius: 26px; padding: 36px 32px; }
      h1 { color: #16332a; font-size: 2rem; font-weight: 600; letter-spacing: -0.035em; line-height: 1.15; }
      p { margin-top: 12px; color: #5f6b64; font-size: 1.0625rem; }
      a { display: inline-block; margin-top: 24px; min-height: 44px; padding: 12px 20px; border-radius: 16px; background: #16332a; color: #fff;
          font-size: 0.875rem; font-weight: 600; text-decoration: none; }
      a:hover { background: #10261f; }
      a:focus-visible { outline: 2px solid #3d6b5a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <!-- This file lives in public/404.html -->
    <main>
      <h1>That page doesn’t exist</h1>
      <p>You may have mistyped the address, or the page may have moved.</p>
      <a href="/">Back to the home page</a>
    </main>
  </body>
</html>
