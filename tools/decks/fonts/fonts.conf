<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for rendering WSS decks with LibreOffice (render.sh sets
  FONTCONFIG_FILE to this file). Decks name Avenir Next and Georgia, which
  are standard in Keynote on a Mac but cannot be shipped; these aliases
  substitute open fonts so the rendered slides keep their spacing:
    Avenir Next -> Nunito Sans (this folder)
    Georgia     -> Gelasio, metric-compatible (docker/fonts, shared with the app)
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <dir prefix="relative">../../../docker/fonts</dir>
  <alias binding="same"><family>Avenir Next</family><prefer><family>Nunito Sans</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
</fontconfig>
