<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WSS link-preview card</title>
<!--
  The default link-preview card (og:image), 1200x630. Rendered to
  public/og-card-2026.png by tools/og-card/render.sh; see README.md there.

  Words: the site name, and the homepage hero heading (app/views/home/index.html.erb,
  "Every pour has a story." with the italic turning phrase). No new copy.
  Look: the homepage .hx styles. Paper ground, bottle-green ink, Instrument Sans
  with one Source Serif 4 italic phrase, and the one green panel holding the
  glass from app/views/shared/_glass.html.erb (cream tone, level 0.62). The glass
  paths below are that partial's output, copied, not redrawn: if the partial
  changes, copy them again.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=block" rel="stylesheet">
<style>
  :root { --paper: #f6f4ee; --ink: #16332a; --mute: #5f6b64; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: "Instrument Sans", system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; position: relative; }

  .copy { position: absolute; left: 84px; top: 78px; bottom: 82px; width: 640px;
          display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-weight: 600; font-size: 56px; line-height: 1; letter-spacing: -.035em; }
  h1 { font-weight: 600; font-size: 128px; line-height: .94; letter-spacing: -.052em; }
  h1 em { font-family: "Source Serif 4", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.035em; }

  .panel { position: absolute; top: 44px; right: 44px; bottom: 44px; width: 384px;
           background: var(--ink); border-radius: 40px;
           display: flex; align-items: center; justify-content: center; }
  .panel svg { width: 282px; height: 376px; display: block; margin-top: 12px; }
</style>
</head>
<body>
  <div class="copy">
    <p class="name">Whiskey Share Society</p>
    <h1>Every pour<br>has <em>a story.</em></h1>
  </div>

  <div class="panel">
    <svg viewBox="0 0 60 80" aria-hidden="true">
      <defs><clipPath id="bowl"><path d="M18.5 5 C19.5 9.5 19.7 12.5 19.2 16 C17.8 25 12 33 12 45 C12 54.5 19.5 61 30 61 C40.5 61 48 54.5 48 45 C48 33 42.2 25 40.8 16 C40.3 12.5 40.5 9.5 41.5 5 Z"/></clipPath></defs>
      <g clip-path="url(#bowl)">
        <path d="M8 38.62 C18 35.22 26 40.62 36 38.02 C42 36.42 48 35.82 52 36.82 L52 70 L8 70 Z" fill="#ff6d00"/>
        <path d="M8 38.62 C18 35.22 26 40.62 36 38.02 C42 36.42 48 35.82 52 36.82 L52 40.02 C46 39.62 42 40.62 36 41.82 C26 44.02 18 39.02 8 42.02 Z" fill="#ff8a33"/>
      </g>
      <path d="M18.5 5 C19.5 9.5 19.7 12.5 19.2 16 C17.8 25 12 33 12 45 C12 54.5 19.5 61 30 61 C40.5 61 48 54.5 48 45 C48 33 42.2 25 40.8 16 C40.3 12.5 40.5 9.5 41.5 5 Z" fill="none" stroke="#f6f4ee" stroke-width="3" stroke-linejoin="round"/>
      <path d="M25.5 61.5 C25.8 65 22.5 66.2 21 69.2 C20.2 71 21.2 72.5 23.2 72.5 L36.8 72.5 C38.8 72.5 39.8 71 39 69.2 C37.5 66.2 34.2 65 34.5 61.5 Z" fill="#f6f4ee" stroke="#f6f4ee" stroke-width="2.4" stroke-linejoin="round"/>
    </svg>
  </div>

  <script>
    // render.sh reads this back with --dump-dom and refuses to publish a card
    // set in fallback fonts.
    document.fonts.ready.then(() => {
      // fonts.check() answers true for a family it has never heard of, so look
      // for the faces themselves.
      const loaded = (family, style) => [...document.fonts].some(f =>
        f.family.replace(/"/g, "") === family && f.style === style && f.status === "loaded");
      const ok = loaded("Instrument Sans", "normal") && loaded("Source Serif 4", "italic");      document.body.dataset.fonts = ok ? "loaded" : "missing";
    });
  </script>
</body>
</html>
